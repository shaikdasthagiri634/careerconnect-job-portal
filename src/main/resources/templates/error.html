<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
    <div class="panel empty-state my-5">
        <i class="bi bi-exclamation-octagon"></i>
        <h1 class="display-5 fw-bold text-dark" th:text="${status}">404</h1>
        <p class="fs-5 text-dark" th:text="${status == 404} ? 'Page not found' : (${status == 403} ? 'Access denied' : 'Something went wrong')">
            Something went wrong</p>
        <p th:if="${message != null and !#strings.isEmpty(message) and message != 'No message available'}" th:text="${message}">Details</p>
        <a th:href="@{/}" class="btn btn-accent">Back to home</a>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
