# Quick-start profile: runs on an in-memory H2 database, no SQL Server needed.
# Run with:  mvn spring-boot:run -Dspring-boot.run.profiles=h2
# (in Eclipse: Run Configurations > Arguments > --spring.profiles.active=h2)
# Data is lost when the app stops.
spring.datasource.url=jdbc:h2:mem:jobportal;MODE=MSSQLServer;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
