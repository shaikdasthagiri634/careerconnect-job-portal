spring.application.name=jobportal
server.port=8080

# ---------------------------------------------------------------
# SQL Server connection  (change username/password to match yours)
# Create the database first:  CREATE DATABASE jobportal_db;
# Tables are created automatically on first start (ddl-auto=update).
# ---------------------------------------------------------------
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=jobportal_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=jobportal_user
spring.datasource.password=JobPortal@123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf (cache off so template edits show without restart)
spring.thymeleaf.cache=false

# Error pages
server.error.include-message=always

# Insert demo users and jobs on first start (empty database only)
app.seed-demo-data=true
