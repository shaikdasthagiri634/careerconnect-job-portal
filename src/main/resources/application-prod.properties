# Settings used when the website runs live on the internet (profile "prod").
# The Dockerfile turns this profile on automatically.

# The hosting company tells the app which port to use in the PORT variable
server.port=${PORT:8080}

# Database: comes from environment variables set on the hosting website.
# If DB_URL is not set, a temporary in-memory database is used
# (demo data is created again each time the app restarts).
spring.datasource.url=${DB_URL:jdbc:h2:mem:jobportal;MODE=MSSQLServer;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
# Empty = Spring Boot picks the right driver from the URL (H2 or PostgreSQL)
spring.datasource.driver-class-name=
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=update
spring.thymeleaf.cache=true
server.error.include-message=never
